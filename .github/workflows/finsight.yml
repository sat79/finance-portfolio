name: FinSight checks
on:
  push:
    paths: ['ai-financial-research-assistant/**', '.github/workflows/finsight.yml']
  pull_request:
    paths: ['ai-financial-research-assistant/**', '.github/workflows/finsight.yml']
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-financial-research-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-financial-research-assistant/requirements-lock.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
