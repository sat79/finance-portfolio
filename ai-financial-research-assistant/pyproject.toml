[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-research"
version = "0.1.0"
description = "Traceable annual financial research from SEC disclosures and analyst CSVs"
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.41,<2",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "requests>=2.32.3,<3",
  "openpyxl>=3.1.5,<4",
  "pypdf==6.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
